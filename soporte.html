<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noti Support</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');

      body {
        font-family: 'Roboto', sans-serif;
        background-color: #f8f8f8;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        color: #333;
      }

      .container {
        max-width: 600px;
        width: 100%;
        background-color: #fff;
        padding: 30px 40px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        margin-top: 40px;
        text-align: center;
      }

      h1 {
        font-weight: 700;
        font-size: 2em;
        margin-bottom: 20px;
        color: #2c3e50;
      }

      p {
        font-weight: 400;
        font-size: 1.1em;
        margin-bottom: 30px;
        line-height: 1.5;
      }

      a {
        display: inline-block;
        background-color: #3498db;
        color: white;
        text-decoration: none;
        padding: 12px 25px;
        font-weight: 600;
        border-radius: 6px;
        transition: background-color 0.3s ease;
        font-size: 1.1em;
      }

      a:hover {
        background-color: #2980b9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Noti Support</h1>
      <p>
        Do you have any questions, suggestions, or issues with the app? We're
        here to help.
      </p>
      <a href="mailto:veritinet@gmail.com" target="_blank" rel="noopener">
        Send email to support
      </a>
    </div>
  </body>
</html>
